[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hre-translate"
version = "0.1.0"
description = "Low-resource H're-Vietnamese machine translation platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<4",
  "pyarrow>=18,<25",
  "pydantic>=2.9,<3",
  "PyYAML>=6,<7",
  "sacrebleu>=2.4,<3",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
neural = [
  "accelerate>=1,<2",
  "datasets>=3,<5",
  "peft>=0.13,<1",
  "sentencepiece>=0.2,<1",
  "torch>=2.2,<3",
  "transformers>=4.45,<5",
]
tracking = ["mlflow>=3,<4"]
serve = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
]
legacy-ui = ["streamlit>=1.40,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
